events { worker_connections 1024; }

http {
    upstream api    { server api:8000; }
    upstream web    { server web:3000; }
    upstream flower { server flower:5555; }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name app.openthaiai.com;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # API
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=3 nodelay;
            proxy_pass http://api/auth/;
            proxy_set_header Host $host;
        }

        location /billing/ {
            proxy_pass http://api/billing/;
            proxy_set_header Host $host;
        }

        # Flower (admin only, restrict by IP in production)
        location /flower/ {
            proxy_pass http://flower/;
            proxy_set_header Host $host;
        }

        # Frontend (PWA)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # PWA service worker
            location /sw.js {
                proxy_pass http://web/sw.js;
                add_header Cache-Control "no-cache";
            }
        }
    }
}
