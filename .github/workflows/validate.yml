name: 🗂️ Validate product catalogs & roadmaps

# รันทุก push และทุก PR — กันไม่ให้ products-<region>.json มี totalProducts ที่ไม่ตรงกับจำนวน item จริง
# (หรือ JSON เสีย / schema เพี้ยน) หลุดเข้า branch. ตรรกะทั้งหมดอยู่ใน validate-products.mjs (stdlib ล้วน).
# นอกจากนี้ยังกันไม่ให้ roadmap HTML แสดงจำนวน "N ขั้นตอน" ที่ไม่ตรงกับผลรวมของ (N) ในแต่ละส่วน
# (validate-roadmaps.mjs — stdlib ล้วนเช่นกัน).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 🗂️ Regional catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Validate products-*.json (totalProducts === actual item count + schema)
        run: node validate-products.mjs
      - name: Validate *_Roadmap.html (headline ขั้นตอน === sum of section counts)
        run: node validate-roadmaps.mjs
